project_id = "presensia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["presensia://**", "http://localhost:8081/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

# Email provider must stay enabled so invited users can sign in / recover
# passwords. Public self-registration is blocked by top-level
# [auth] enable_signup = false (GOTRUE_DISABLE_SIGNUP), per PRD §27.1.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.check-in]
verify_jwt = true

[functions.check-out]
verify_jwt = true

[functions.admin-create-participant]
verify_jwt = true

[functions.admin-update-participant]
verify_jwt = true

[functions.admin-upload-avatar]
verify_jwt = true

[functions.admin-correct-attendance]
verify_jwt = true

[functions.admin-create-attendance]
verify_jwt = true

[functions.review-leave]
verify_jwt = true

[functions.update-attendance-settings]
verify_jwt = true

[functions.create-signed-url]
verify_jwt = true

[functions.cleanup-orphans]
verify_jwt = true
